<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الهنا ماركت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        .login-box, .admin-box { background: white; max-width: 650px; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        h2 { font-size: 20px; margin-bottom: 15px; color: #0f172a; font-weight: 800; }
        .form-section { background: #f1f5f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #475569; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
        input:focus { border-color: #10b981; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; }
        .btn-edit { background: #3b82f6; }
        .btn-secondary { background: #64748b; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .actions { display: flex; gap: 5px; }
        .actions button { width: auto; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-box">
        <h2>🔒 تسجيل الدخول للوحة التحكم</h2>
        <div class="input-group">
            <label>كلمة السر</label>
            <input type="password" id="pass-input" placeholder="أدخل كلمة السر">
        </div>
        <button id="login-btn">دخول اللوحة</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-panel" class="admin-box hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>🛠️ إدارة منتجات "الهنا ماركت"</h2>
            <button id="change-pass-btn" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;">🔑 تغيير كلمة السر</button>
        </div>

        <!-- تغيير كلمة السر -->
        <div id="pass-change-section" class="form-section hidden" style="background: #fff7ed; border-color: #ffedd5;">
            <h3 style="font-size:15px; margin-bottom:10px; color:#c2410c;">تغيير كلمة السر الخاصة باللوحة</h3>
            <div class="input-group">
                <label>كلمة السر الجديدة</label>
                <input type="password" id="new-pass" placeholder="أدخل كلمة السر الجديدة">
            </div>
            <button id="save-pass-btn" class="btn-warning">حفظ كلمة السر الجديدة</button>
            <button id="cancel-pass-btn" class="btn-danger" style="margin-top:5px;">إلغاء</button>
        </div>
        
        <!-- إضافة/تعديل المنتجات -->
        <div class="form-section">
            <h3 id="form-title" style="font-size:16px; margin-bottom:12px;">إضافة منتج جديد</h3>
            <input type="hidden" id="edit-id">
            
            <div class="input-group">
                <label>اسم المنتج</label>
                <input type="text" id="p-name" placeholder="مثال: شيبسي عائلي طماطم">
            </div>

            <div class="input-group">
                <label>السعر (بالجنيه)</label>
                <input type="number" id="p-price" placeholder="مثال: 15">
            </div>

            <div class="input-group">
                <label>القسم</label>
                <input type="text" id="p-cat" placeholder="مثال: بقالة، مشروبات، مجمدات">
            </div>

            <div class="input-group">
                <label>صورة المنتج (اختر صورة من الاستوديو أو التقط صورة)</label>
                <!-- تم تعديل السطر ده لتخيرك في الموبايل بين الاستوديو والكاميرا -->
                <input type="file" id="p-file" accept="image/*">
            </div>

            <div class="input-group">
                <label>أو ضع رابط صورة جاهز (URL)</label>
                <input type="text" id="p-img" placeholder="https://...">
            </div>

            <button id="save-btn">حفظ وإضافة المنتج أونلاين</button>
            <button id="cancel-btn" class="btn-danger hidden" style="margin-top:8px;">إلغاء التعديل</button>
        </div>

        <div>
            <h3 style="font-size:16px; margin-bottom:12px;">قائمة المنتجات الحالية</h3>
            <div id="items-list">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDk1wEvGuPjcVemWJTQL7sS6hFj4pBz1Ak",
            authDomain: "al-hana-market.firebaseapp.com",
            projectId: "al-hana-market",
            storageBucket: "al-hana-market.firebasestorage.app",
            messagingSenderId: "272160497482",
            appId: "1:272160497482:web:9009257570838ab0f26bb3",
            measurementId: "G-FCMBXK8YTP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentPassword = "123456";

        async function loadPassword() {
            try {
                const passDoc = await getDoc(doc(db, "settings", "admin"));
                if (passDoc.exists() && passDoc.data().password) {
                    currentPassword = passDoc.data().password;
                }
            } catch (e) { console.log(e); }
        }
        loadPassword();

        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('pass-input').value;
            if(pass === currentPassword) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        });

        document.getElementById('change-pass-btn').addEventListener('click', () => {
            document.getElementById('pass-change-section').classList.toggle('hidden');
        });
        document.getElementById('cancel-pass-btn').addEventListener('click', () => {
            document.getElementById('pass-change-section').classList.add('hidden');
        });

        document.getElementById('save-pass-btn').addEventListener('click', async () => {
            const newPass = document.getElementById('new-pass').value.trim();
            if (!newPass) return alert('يرجى أدخال كلمة السر الجديدة!');

            await setDoc(doc(db, "settings", "admin"), { password: newPass });
            currentPassword = newPass;
            alert('تم تغيير كلمة السر بنجاح!');
            document.getElementById('new-pass').value = '';
            document.getElementById('pass-change-section').classList.add('hidden');
        });

        // تحويل وضغط الصورة فورياً
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 400; // حجم مصغر وممتاز للظهور في المتجر
                        const scaleSize = maxWidth / img.width;
                        
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const base64Url = canvas.toDataURL('image/jpeg', 0.5);
                        resolve(base64Url);
                    };
                };
            });
        }

        async function getImageUrl() {
            const fileInput = document.getElementById('p-file');
            if (fileInput.files.length > 0) {
                return await processImage(fileInput.files[0]);
            }
            return document.getElementById('p-img').value.trim();
        }

        document.getElementById('save-btn').addEventListener('click', async () => {
            const name = document.getElementById('p-name').value.trim();
            const price = document.getElementById('p-price').value.trim();
            const category = document.getElementById('p-cat').value.trim() || 'عام';
            const editId = document.getElementById('edit-id').value;

            if(!name || !price) {
                return alert('يرجى كتابة الاسم والسعر!');
            }

            document.getElementById('save-btn').innerText = "جاري الحفظ الفوري...";
            document.getElementById('save-btn').disabled = true;

            try {
                const imageUrl = await getImageUrl();

                if(editId) {
                    await updateDoc(doc(db, "products", editId), {
                        name: name,
                        price: Number(price),
                        category: category,
                        image: imageUrl
                    });
                    alert('تم تعديل البيانات بنجاح!');
                } else {
                    await addDoc(collection(db, "products"), {
                        name: name,
                        price: Number(price),
                        category: category,
                        image: imageUrl,
                        outOfStock: false
                    });
                    alert('تم إضافة المنتج للمتجر فوراً!');
                }
                resetForm();
            } catch (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } finally {
                document.getElementById('save-btn').innerText = "حفظ وإضافة المنتج أونلاين";
                document.getElementById('save-btn').disabled = false;
            }
        });

        window.startEdit = (id, name, price, category, image) => {
            document.getElementById('form-title').innerText = "تعديل بيانات المنتج";
            document.getElementById('edit-id').value = id;
            document.getElementById('p-name').value = name;
            document.getElementById('p-price').value = price;
            document.getElementById('p-cat').value = category;
            document.getElementById('p-img').value = image;
            document.getElementById('save-btn').innerText = "تحديث البيانات الآن";
            document.getElementById('cancel-btn').classList.remove('hidden');
        };

        document.getElementById('cancel-btn').addEventListener('click', resetForm);

        function resetForm() {
            document.getElementById('form-title').innerText = "إضافة منتج جديد";
            document.getElementById('edit-id').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-cat').value = '';
            document.getElementById('p-img').value = '';
            document.getElementById('p-file').value = '';
            document.getElementById('save-btn').innerText = "حفظ وإضافة المنتج أونلاين";
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        window.deleteProduct = async (id) => {
            if(confirm('هل أنت تأكد من إزالة هذا المنتج؟')) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        window.toggleStock = async (id, status) => {
            await updateDoc(doc(db, "products", id), {
                outOfStock: !status
            });
        };

        onSnapshot(collection(db, "products"), (snapshot) => {
            const container = document.getElementById('items-list');
            container.innerHTML = '';
            
            snapshot.forEach((itemDoc) => {
                const item = itemDoc.data();
                const id = itemDoc.id;
                
                container.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>${item.name}</strong> - <span style="color:#10b981; font-weight:bold;">${item.price} ج.م</span>
                            <div style="font-size:11px; color:#64748b; margin-top:2px;">
                                القسم: ${item.category || 'عام'} | الحالة: ${item.outOfStock ? '🔴 نفذت' : '🟢 متوفر'}
                            </div>
                        </div>
                        <div class="actions">
                            <button onclick="startEdit('${id}', '${item.name}', ${item.price}, '${item.category || ''}', '${item.image || ''}')" class="btn-edit">تعديل</button>
                            <button onclick="toggleStock('${id}', ${item.outOfStock})" class="btn-warning">الحالة</button>
                            <button onclick="deleteProduct('${id}')" class="btn-danger">حذف</button>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
